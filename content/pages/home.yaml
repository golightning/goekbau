blocks:
  - id: intro
    title: Über uns
    body: |
      **Wir überwachen Bau und Instandhaltung von Gleisanlagen – als Fachbauüberwacher Oberbau und Bauüberwacher Bahn nach den Richtlinien der DB InfraGO.**

      Deniz Gök hat die GÖK Bauüberwachung Bahn GmbH im Mai 2023 gegründet. Unser Team bringt 21 Jahre Erfahrung aus dem Gleisbau mit.

      Wir sorgen dafür, dass Ihre Baumaßnahme sicher, termingerecht und vertragskonform läuft: mit vorausschauender Planung und penibler Genauigkeit.
    cta:
      label: Mehr über uns
      href: /uber-uns/
