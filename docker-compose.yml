# Lokaler Prod-Nachbau: `pnpm local` (Stoppen: `pnpm local:down`)
# Website: http://localhost:8080  ·  Mailpit (SMTP-Fänger mit STARTTLS): http://localhost:8025
# Alle Werte hier sind reine Entwicklungswerte – Produktion nutzt Deploy-Now-Runtime-Secrets.
services:
  web:
    build: docker/web
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./dist/site:/var/www/html:ro
      - storage:/var/www/storage
    environment:
      GOEKBAU_ENV: local
      GOEKBAU_SECRET: lokal-nur-fuer-entwicklung-0123456789abcdef # gitleaks:allow (reiner Entwicklungswert)
      GOEKBAU_ALLOWED_ORIGINS: http://localhost:8080,http://127.0.0.1:8080,http://localhost:3000 # 3000 = pnpm dev (Proxy)
      GOEKBAU_STORAGE_DIR: /var/www/storage
      GOEKBAU_SMTP_HOST: mailpit
      GOEKBAU_SMTP_PORT: "1025"
      GOEKBAU_SMTP_USER: website@goekbau.de
      GOEKBAU_SMTP_PASS: lokal
      GOEKBAU_SMTP_SECURE: tls
      GOEKBAU_SMTP_VERIFY_PEER: "0" # selbst signiertes Mailpit-Zertifikat, nur lokal
      GOEKBAU_MAIL_FROM: website@goekbau.de
      GOEKBAU_MAIL_FROM_NAME: Website goekbau.de
      GOEKBAU_MAIL_TO_CONTACT: info@goekbau.de
      GOEKBAU_MAIL_TO_APPLICATION: deniz.goek@goekbau.de
      GOEKBAU_MAIL_TO_MONITOR: monitor@golightning.ai
      GOEKBAU_MONITOR_TOKEN: lokal-monitor-token-0123456789abcdef0123
    depends_on:
      - mailpit

  mailpit:
    image: axllent/mailpit@sha256:23fe39e81bde596a918000b3135c0f85dc8bb4c9ea6be274b051143f3e300387
    ports:
      - "127.0.0.1:8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_TLS_CERT: sans:mailpit
      MP_SMTP_TLS_KEY: sans:mailpit
      MP_SMTP_REQUIRE_STARTTLS: "true"

volumes:
  storage:
